name: check-guidelines

on:
  schedule:
    # Run every Sunday at 9:00 AM UTC (same as Dependabot)
    - cron: "0 9 * * 0"
  workflow_dispatch:
    inputs:
      create-issues:
        description: "Create issues for unmet guidelines (overrides config)"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

# Declare default permissions as read only
permissions: read-all

jobs:
  check-guidelines:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout .github repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Install dependencies
        working-directory: ./scripts
        run: npm install

      - name: Run guideline checks
        working-directory: ./scripts
        env:
          PAT_TOKEN: ${{ secrets.GUIDELINE_CHECKER_TOKEN }}
          GITHUB_ORG: outoforbitdev
        run: |
          CREATE_ISSUES_FLAG=""
          # Create issues by default for scheduled runs
          if [ "${{ github.event_name }}" = "schedule" ]; then
            CREATE_ISSUES_FLAG="--create-issues"
          fi
          # For workflow_dispatch, only create issues if explicitly requested
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ github.event.inputs.create-issues }}" = "true" ]; then
            CREATE_ISSUES_FLAG="--create-issues"
          fi

          node check-guidelines.js \
            --org outoforbitdev \
            --config guidelines-config.yaml \
            $CREATE_ISSUES_FLAG
