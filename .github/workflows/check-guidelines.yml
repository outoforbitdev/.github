name: check-guidelines

on:
  schedule:
    # Run every Sunday at 9:00 AM UTC (same as Dependabot)
    - cron: "0 9 * * 0"
  workflow_dispatch:
    inputs:
      create-issues:
        description: "Create issues for unmet guidelines (overrides config)"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
  # TODO: Remove push trigger before merging - this is for testing only
  push:
    branches:
      - jaymirecki/22-create-guideline-script

# Declare default permissions as read only
permissions: read-all

jobs:
  check-guidelines:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout .github repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install dependencies
        working-directory: ./scripts
        run: npm install

      - name: Run guideline checks
        working-directory: ./scripts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ORG: outoforbitdev
        run: |
          CREATE_ISSUES_FLAG=""
          if [ "${{ github.event.inputs.create-issues }}" = "true" ]; then
            CREATE_ISSUES_FLAG="--create-issues"
          fi

          node check-guidelines.js \
            --org outoforbitdev \
            --config guidelines-config.yaml \
            $CREATE_ISSUES_FLAG
