name: work-queue-summary-test

# Runs the unit tests for the work queue summary scripts. The dry run of the
# workflow itself is a pull_request trigger on work-queue-summary.yml.

on:
  pull_request:
    paths:
      - ".github/workflows/work-queue-summary*.yml"
      - "scripts/work-queue*.js"
      - "scripts/package*.json"
  workflow_dispatch:

# Declare default permissions as none.
permissions: {}

jobs:
  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout .github repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "24"

      - name: Install dependencies
        working-directory: ./scripts
        run: npm ci

      - name: Run tests
        working-directory: ./scripts
        run: npm test
